# E7: x0 target with uniform weight 8 on the 9D global SE(3) delta.
DATA:
  DATASET_NAME: ee4d
  REPRE_TYPE: v4_beta
  COND_BETAS: False
  COND_IMG_FEAT: True
  COND_TRAJ: True
  WINDOW: 80
  IMG_FEAT_TYPE: dinov2
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True
  PERSISTENT_WORKERS: True
  PREFETCH_FACTOR: 2
  DROP_LAST: True

MODEL:
  MODEL_NAME: uem
  GENERATIVE_TYPE: flow

FLOW:
  REPAINT_ENABLED: False
  NUM_STEPS: 10
  SOLVER: euler
  BETA_ALPHA: 1.5
  BETA_BETA: 1.0
  T_MIN: 0.001
  PREDICTION_TYPE: x0
  GLOBAL_WEIGHT: 8.0
  GLOBAL_FEATURE_START: 198
  GLOBAL_FEATURE_END: 207

TRAIN:
  EXP_PATH: exp/e7_x0_global_w8_u84k
  USE_CKPT_LR: True
  WEIGHT_DECAY: 0.01
  LR: 8.5e-5
  NUM_EPOCHS: 300
  NUM_GPUS: 2
  PRECISION: bf16-mixed
  ACCUMULATE_GRAD_BATCHES: 1
  GRADIENT_CLIP_VAL: 1.0
  DDP_STATIC_GRAPH: True
  CUDNN_BENCHMARK: True
  FUSED_ADAMW: False
  EMA_DECAY: 0.992028
  SCHEDULER: cosine_warmup
  WARMUP_EPOCHS: 5
  SCHEDULER_TOTAL_EPOCHS: 300
  MIN_LR_RATIO: 0.1
  NUM_SANITY_VAL_STEPS: 0
  LOG_EVERY_N_STEPS: 10
  PROGRESS_REFRESH_RATE: 10
  CHECK_VAL_EVERY_N_EPOCHS: 5
  SAVE_EVERY_N_EPOCHS: 10
  EARLY_STOP_PATIENCE: 0
  EARLY_STOP_MIN_DELTA: 1.0e-4
  EVAL_SUFFIX: _ablation_e7_x0_global_w8_euler10

EVAL:
  KEY_JOINTS_ONLY: True
  KEY_JOINT_INDICES: [0, 4, 5, 7, 8, 10, 11, 15, 18, 19, 20, 21]
  RUN_SEMANTIC: False
  NUM_GPUS: 1
  NUM_SAMPLES: 256
  BATCH_SIZE: 64
