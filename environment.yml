name: egorecover
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.10.0+cu126
      - -e .[body,assets,dev]
variables:
  PYTHONNOUSERSITE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  HF_HUB_DISABLE_XET: '1'
